name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository code to the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Basic validation for our static HTML application
      - name: Run tests
        run: |
          test -f index.html
          grep -qi "<html" index.html
          echo "HTML validation passed"

      # 3. Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t florea:${{ github.sha }} .

      # 4. Scan the Docker image for vulnerabilities
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: florea:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Tag and push the image to ECR
      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: florea
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag florea:${IMAGE_TAG} $REGISTRY/$REPOSITORY:${IMAGE_TAG}
          docker push $REGISTRY/$REPOSITORY:${IMAGE_TAG}

